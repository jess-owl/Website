title: "Jess Morris"
tagline: "Drone autonomy & testing"
description: >-
  Demo videos, pipelines, and notes from my work on autonomous drone systems.
baseurl: "/Website"
url: ""

author:
  name: "Jess Morris"
  role: "Lab for Engineering Safe Software (LESS), University of Virginia"
  photo: /assets/images/profile/profile.jpg
  cv: /assets/cv.pdf
  email: "krw5eu@virginia.edu"

# github-pages defaults to jekyll-theme-primer when this isn't set, which
# silently overwrites assets/css/style.css with the theme's own stylesheet.
theme: null

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
