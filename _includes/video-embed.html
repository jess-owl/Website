<div class="video-block">
  <div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/{{ include.id }}" title="{{ include.caption | default: page.title }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
  </div>
  {% if include.caption %}<p class="caption">{{ include.caption }}</p>{% endif %}
</div>
